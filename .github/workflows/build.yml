# Сборка в облаке GitHub: после каждого push в main — анализ и тесты,
# APK для Android, Windows-версия и релиз на странице Releases
# (последний помечен Latest, хранятся 10 последних).
#
# Чтобы новые APK ставились поверх уже установленного Cash, они должны быть
# подписаны тем же ключом. Ключ (файл debug.keystore в base64) берётся из
# секрета ANDROID_DEBUG_KEYSTORE, а если его нет — из переменной с тем же
# именем (вкладка Variables). См. README, раздел «Сборка в GitHub».
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  VERSION: 1.0.${{ github.run_number }}

jobs:
  android:
    name: Тесты и Android
    runs-on: ubuntu-latest
    outputs:
      key_sha256: ${{ steps.key.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Подготовка
        shell: pwsh
        run: ./scripts/prepare.ps1
      - name: Анализ кода
        run: scripts/ci-run.sh "Анализ кода" flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Тесты
        run: scripts/ci-run.sh "Тесты" flutter test --reporter expanded
      - name: Ключ подписи APK
        id: key
        env:
          KEY_SECRET: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
          KEY_VAR: ${{ vars.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$KEY_SECRET" ]; then
            src='секрета ANDROID_DEBUG_KEYSTORE'; key="$KEY_SECRET"
          elif [ -n "$KEY_VAR" ]; then
            src='переменной ANDROID_DEBUG_KEYSTORE (Variables)'; key="$KEY_VAR"
          else
            echo "::warning title=Ключ подписи::Ни секрета, ни переменной ANDROID_DEBUG_KEYSTORE для GitHub Actions в этом репозитории не видно — APK подписан временным ключом и поверх установленного Cash не установится. Секрет должен быть в Settings → Secrets and variables → Actions → Repository secrets (не Codespaces, не Dependabot, не Environment)."
            exit 0
          fi
          mkdir -p ~/.android
          if ! printf '%s' "$key" | tr -d ' \r\n\t' | base64 -d > ~/.android/debug.keystore 2>/dev/null; then
            echo "::error title=Ключ подписи::Значение из $src — не base64. Скопируйте ключ командой из README ещё раз."
            exit 1
          fi
          fp=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey 2>/dev/null | awk '/SHA256:/ {print $2; exit}')
          if [ -z "$fp" ]; then
            echo "::error title=Ключ подписи::Ключ из $src не открывается как debug.keystore (пароль android, alias androiddebugkey)."
            exit 1
          fi
          echo "sha256=$fp" >> "$GITHUB_OUTPUT"
          # Android Gradle Plugin ищет debug.keystore в $ANDROID_USER_HOME
          # (раньше всех других мест) — указываем явно.
          echo "ANDROID_USER_HOME=$HOME/.android" >> "$GITHUB_ENV"
          echo "KEY_SHA256=$fp" >> "$GITHUB_ENV"
          echo "Переменные Android на раннере:"; env | grep -E '^ANDROID_(USER_HOME|PREFS_ROOT|SDK_HOME|EMULATOR_HOME)=' || true
          echo "::notice title=Ключ подписи::APK подписывается ключом из $src, SHA-256 $fp"
      - name: Сборка APK
        run: |
          scripts/ci-run.sh "Сборка APK" flutter build apk --release --build-name=${{ env.VERSION }} --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk Cash-${{ env.VERSION }}.apk
          apk_fp=$(python3 scripts/apk_cert.py Cash-${{ env.VERSION }}.apk | awk '{print $2}')
          echo "Подпись собранного APK: $apk_fp"
          if [ -n "${KEY_SHA256:-}" ] && [ "$apk_fp" != "$KEY_SHA256" ]; then
            found=$(find "$HOME" /usr/local/lib/android -name debug.keystore 2>/dev/null | tr '\n' ' ')
            echo "::error title=Ключ подписи::APK подписан не тем ключом: $apk_fp вместо $KEY_SHA256. Найденные debug.keystore: $found"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Cash-android
          path: Cash-${{ env.VERSION }}.apk
          retention-days: 14

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Подготовка
        shell: pwsh
        run: ./scripts/prepare.ps1
      - name: Сборка Windows
        # Полный шрифт иконок: на Windows урезанный шрифт иногда теряет новые иконки.
        shell: bash
        run: scripts/ci-run.sh "Сборка Windows" flutter build windows --release --no-tree-shake-icons --build-name=${{ env.VERSION }} --build-number=${{ github.run_number }}
      - name: Пакування
        shell: pwsh
        run: |
          $release = 'build\windows\x64\runner\Release'
          # Библиотеки Visual C++, чтобы программа запускалась на любом Windows 10/11
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$dll" $release -Force
          }
          New-Item -ItemType Directory -Force -Path 'pkg\Cash-windows' | Out-Null
          Copy-Item -Recurse -Path "$release\*" -Destination 'pkg\Cash-windows'
          Compress-Archive -Path 'pkg\Cash-windows' -DestinationPath 'Cash-windows-${{ env.VERSION }}.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: Cash-windows
          path: Cash-windows-${{ env.VERSION }}.zip
          retention-days: 14

  release:
    name: Релиз
    needs: [android, windows]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Публикация
        env:
          GH_TOKEN: ${{ github.token }}
          KEY_SHA256: ${{ needs.android.outputs.key_sha256 }}
        run: |
          set -euo pipefail
          {
            echo "Коммит ${GITHUB_SHA::7}: $(git log -1 --format=%s)"
            echo
            echo "- **Android:** \`Cash-${VERSION}.apk\` — скачайте на телефон и установите."
            echo "- **Windows:** \`Cash-windows-${VERSION}.zip\` — распакуйте и запустите \`Cash-windows\\cash.exe\`."
            echo
            if [ -n "$KEY_SHA256" ]; then
              echo "Подпись APK (SHA-256): \`${KEY_SHA256}\`"
            else
              echo "> ⚠️ APK подписан временным ключом: поверх уже установленного Cash он не установится. Как это исправить — README, раздел «Сборка в GitHub»."
            fi
          } > notes.md
          gh release create "v${VERSION}" out/* --target "$GITHUB_SHA" --title "Cash ${VERSION}" --notes-file notes.md --latest
          # Хранятся 10 последних релизов.
          gh release list --limit 100 --json tagName --jq '.[10:][].tagName' | while read -r old; do
            gh release delete "$old" --cleanup-tag --yes || true
          done

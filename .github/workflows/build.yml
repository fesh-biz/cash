# Сборка в облаке GitHub: после каждого push в main — анализ и тесты,
# APK для Android, Windows-версия и релиз на странице Releases
# (последний помечен Latest, хранятся 10 последних).
#
# Чтобы новые APK ставились поверх уже установленного Cash, они должны быть
# подписаны тем же ключом. Ключ (файл debug.keystore в base64) берётся из
# секрета ANDROID_DEBUG_KEYSTORE, а если его нет — из переменной с тем же
# именем (вкладка Variables). См. README, раздел «Сборка в GitHub».
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  VERSION: 1.0.${{ github.run_number }}

jobs:
  android:
    name: Тести та Android
    runs-on: ubuntu-latest
    outputs:
      key_sha256: ${{ steps.key.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Підготовка
        shell: pwsh
        run: ./scripts/prepare.ps1
      - name: Аналіз коду
        run: scripts/ci-run.sh "Аналіз коду" flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Тести
        run: scripts/ci-run.sh "Тести" flutter test --reporter expanded
      - name: Ключ підпису APK
        id: key
        env:
          KEY_SECRET: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
          KEY_VAR: ${{ vars.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$KEY_SECRET" ]; then
            src='секрету ANDROID_DEBUG_KEYSTORE'; key="$KEY_SECRET"
          elif [ -n "$KEY_VAR" ]; then
            src='змінної ANDROID_DEBUG_KEYSTORE (Variables)'; key="$KEY_VAR"
          else
            echo "::warning title=Ключ підпису::Ні секрету, ні змінної ANDROID_DEBUG_KEYSTORE для GitHub Actions у цьому репозиторії не видно — APK підписано тимчасовим ключем і поверх установленого Cash він не встановиться. Секрет має бути в Settings → Secrets and variables → Actions → Repository secrets (не Codespaces, не Dependabot, не Environment)."
            exit 0
          fi
          mkdir -p ~/.android
          if ! printf '%s' "$key" | tr -d ' \r\n\t' | base64 -d > ~/.android/debug.keystore 2>/dev/null; then
            echo "::error title=Ключ підпису::Значення з $src — не base64. Скопіюйте ключ командою з README ще раз."
            exit 1
          fi
          fp=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey 2>/dev/null | awk '/SHA256:/ {print $2; exit}')
          if [ -z "$fp" ]; then
            echo "::error title=Ключ підпису::Ключ із $src не відкривається як debug.keystore (пароль android, alias androiddebugkey)."
            exit 1
          fi
          echo "sha256=$fp" >> "$GITHUB_OUTPUT"
          echo "::notice title=Ключ підпису::APK підписується ключем із $src, SHA-256 $fp"
      - name: Збірка APK
        run: |
          scripts/ci-run.sh "Збірка APK" flutter build apk --release --build-name=${{ env.VERSION }} --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk Cash-${{ env.VERSION }}.apk
          echo "Підпис зібраного APK:"
          python3 scripts/apk_cert.py Cash-${{ env.VERSION }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Cash-android
          path: Cash-${{ env.VERSION }}.apk
          retention-days: 14

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Підготовка
        shell: pwsh
        run: ./scripts/prepare.ps1
      - name: Збірка Windows
        # Полный шрифт иконок: на Windows урезанный шрифт иногда теряет новые иконки.
        shell: bash
        run: scripts/ci-run.sh "Збірка Windows" flutter build windows --release --no-tree-shake-icons --build-name=${{ env.VERSION }} --build-number=${{ github.run_number }}
      - name: Пакування
        shell: pwsh
        run: |
          $release = 'build\windows\x64\runner\Release'
          # Библиотеки Visual C++, чтобы программа запускалась на любом Windows 10/11
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$dll" $release -Force
          }
          New-Item -ItemType Directory -Force -Path 'pkg\Cash-windows' | Out-Null
          Copy-Item -Recurse -Path "$release\*" -Destination 'pkg\Cash-windows'
          Compress-Archive -Path 'pkg\Cash-windows' -DestinationPath 'Cash-windows-${{ env.VERSION }}.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: Cash-windows
          path: Cash-windows-${{ env.VERSION }}.zip
          retention-days: 14

  release:
    name: Реліз
    needs: [android, windows]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Публікація
        env:
          GH_TOKEN: ${{ github.token }}
          KEY_SHA256: ${{ needs.android.outputs.key_sha256 }}
        run: |
          set -euo pipefail
          {
            echo "Коміт ${GITHUB_SHA::7}: $(git log -1 --format=%s)"
            echo
            echo "- **Android:** \`Cash-${VERSION}.apk\` — скачайте на телефон і встановіть."
            echo "- **Windows:** \`Cash-windows-${VERSION}.zip\` — розпакуйте й запустіть \`Cash-windows\\cash.exe\`."
            echo
            if [ -n "$KEY_SHA256" ]; then
              echo "Підпис APK (SHA-256): \`${KEY_SHA256}\`"
            else
              echo "> ⚠️ APK підписано тимчасовим ключем: поверх уже встановленого Cash він не встановиться. Як це виправити — README, розділ «Сборка в GitHub»."
            fi
          } > notes.md
          gh release create "v${VERSION}" out/* --target "$GITHUB_SHA" --title "Cash ${VERSION}" --notes-file notes.md --latest
          # Хранятся 10 последних релизов.
          gh release list --limit 100 --json tagName --jq '.[10:][].tagName' | while read -r old; do
            gh release delete "$old" --cleanup-tag --yes || true
          done

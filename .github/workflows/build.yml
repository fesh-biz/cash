# Сборка в облаке GitHub: после каждого push в main — анализ и тесты,
# APK для Android, Windows-версия и релиз на странице Releases
# (последний помечен Latest, хранятся 10 последних).
#
# Чтобы новые APK ставились поверх уже установленного Cash, они должны быть
# подписаны тем же ключом. Ключ берётся из секрета ANDROID_DEBUG_KEYSTORE
# (файл debug.keystore в base64) — см. README, раздел «Збірка в GitHub».
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  VERSION: 1.0.${{ github.run_number }}

jobs:
  android:
    name: Тести та Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Підготовка
        shell: pwsh
        run: ./scripts/prepare.ps1
      - name: Аналіз коду
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Тести
        run: flutter test --reporter expanded
      - name: Ключ підпису APK
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE" | base64 -d > ~/.android/debug.keystore
            echo "Підпис: ключ із секрету ANDROID_DEBUG_KEYSTORE"
          else
            echo "::warning::Секрет ANDROID_DEBUG_KEYSTORE не задано — APK підписано тимчасовим ключем і поверх установленого Cash він не встановиться (див. README)."
          fi
      - name: Збірка APK
        run: |
          flutter build apk --release --build-name=${{ env.VERSION }} --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk Cash-${{ env.VERSION }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Cash-android
          path: Cash-${{ env.VERSION }}.apk
          retention-days: 14

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Підготовка
        shell: pwsh
        run: ./scripts/prepare.ps1
      - name: Збірка Windows
        # Полный шрифт иконок: на Windows урезанный шрифт иногда теряет новые иконки.
        run: flutter build windows --release --no-tree-shake-icons --build-name=${{ env.VERSION }} --build-number=${{ github.run_number }}
      - name: Пакування
        shell: pwsh
        run: |
          $release = 'build\windows\x64\runner\Release'
          # Библиотеки Visual C++, чтобы программа запускалась на любом Windows 10/11
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$dll" $release -Force
          }
          New-Item -ItemType Directory -Force -Path 'pkg\Cash-windows' | Out-Null
          Copy-Item -Recurse -Path "$release\*" -Destination 'pkg\Cash-windows'
          Compress-Archive -Path 'pkg\Cash-windows' -DestinationPath 'Cash-windows-${{ env.VERSION }}.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: Cash-windows
          path: Cash-windows-${{ env.VERSION }}.zip
          retention-days: 14

  release:
    name: Реліз
    needs: [android, windows]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Публікація
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ secrets.ANDROID_DEBUG_KEYSTORE != '' }}
        run: |
          set -euo pipefail
          {
            echo "Коміт ${GITHUB_SHA::7}: $(git log -1 --format=%s)"
            echo
            echo "- **Android:** \`Cash-${VERSION}.apk\` — скачайте на телефон і встановіть."
            echo "- **Windows:** \`Cash-windows-${VERSION}.zip\` — розпакуйте й запустіть \`Cash-windows\\cash.exe\`."
            if [ "$SIGNED" != "true" ]; then
              echo
              echo "> ⚠️ APK підписано тимчасовим ключем: поверх уже встановленого Cash він не встановиться. Як це виправити — README, розділ «Збірка в GitHub»."
            fi
          } > notes.md
          gh release create "v${VERSION}" out/* --target "$GITHUB_SHA" --title "Cash ${VERSION}" --notes-file notes.md --latest
          # Хранятся 10 последних релизов.
          gh release list --limit 100 --json tagName --jq '.[10:][].tagName' | while read -r old; do
            gh release delete "$old" --cleanup-tag --yes || true
          done
